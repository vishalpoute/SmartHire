services:
  - type: web
    name: smarthire-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: services/api
    buildCommand: python -m pip install -r requirements.lock.txt && python -m pip install . --no-deps
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: FIREBASE_PROJECT_ID
        value: smarthire-dev-99f32
      - key: ALLOWED_ORIGINS
        value: https://smarthire-vishalpoute.antideploy.app
