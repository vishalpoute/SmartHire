[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smarthire-api"
version = "0.1.0"
description = "SmartHire authentication and job-portal API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "firebase-admin>=6.6,<8", "google-cloud-firestore>=2.21,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
