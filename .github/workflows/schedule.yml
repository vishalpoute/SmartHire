name: Schedule checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/test_work_window.py
